<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Logic Mindset → Compound Sentence</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f1ea;--bg2:#eceadf;--card:#fff;--border:#ddd8cb;--border2:#c9c3b3;
  --ink:#1b1814;--ink2:#595249;--ink3:#9a9285;
  --accent:#2b5f88;--accent-l:#e7f1f8;--accent-xl:#f1f7fc;--accent-m:#3879b5;
  --green:#1c6847;--green-l:#e6f3ec;--green-m:#28875f;
  --red:#b52c2c;--red-l:#fdf0f0;
  --amber:#8a5a00;--amber-l:#fff8e6;--amber-m:#f5c840;
  --purple:#562b8a;--purple-l:#f2eeff;
  --teal:#0d6255;--teal-l:#e7f6f3;
  --orange:#b84f00;--orange-l:#fff2e6;
  --r:14px;--r-sm:8px;--r-lg:20px;--r-xl:24px;
  --sh:0 2px 8px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.04);
  --sh-h:0 10px 32px rgba(0,0,0,.11),0 0 0 1px rgba(0,0,0,.05);
  --t:.2s cubic-bezier(.4,0,.2,1)
}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{font-family:'Lexend',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;min-height:100vh;padding-bottom:80px}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:200;background:rgba(244,241,234,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:700px;margin:0 auto;display:flex;align-items:center;gap:12px;height:54px;padding:0 16px}
.topbar-logo{font-size:13px;font-weight:700;color:var(--accent);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-pill{font-size:12px;font-weight:700;color:var(--green);background:var(--green-l);border:1px solid #9dd4b6;padding:4px 12px;border-radius:20px;white-space:nowrap;transition:var(--t)}
.score-pill.bump{animation:bump .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.2);background:var(--green);color:#fff}100%{transform:scale(1)}}

/* ── PROGRESS ── */
.prog-wrap{max-width:700px;margin:0 auto;padding:12px 16px 0}
.prog-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:5px}
.prog-meta b{color:var(--ink2);font-weight:600}
.prog-track{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent-m),var(--teal));border-radius:2px;width:0%;transition:width .5s cubic-bezier(.4,0,.2,1)}

/* ── FILTER TABS ── */
.filter-wrap{max-width:700px;margin:14px auto 0;padding:0 16px}
.filter-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filter-scroll::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:6px 14px;border-radius:20px;font-family:'Lexend',sans-serif;font-size:12px;font-weight:500;cursor:pointer;border:1.5px solid var(--border2);background:var(--card);color:var(--ink2);transition:var(--t);white-space:nowrap}
.ftab:hover{border-color:var(--accent-m);color:var(--accent);background:var(--accent-xl)}
.ftab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ftab .ct{opacity:.6;margin-left:3px;font-size:11px}

/* ── MAIN ── */
.main{max-width:700px;margin:16px auto 0;padding:0 16px;display:flex;flex-direction:column;gap:16px}
.lv-sep{display:flex;align-items:center;gap:10px}
.lv-sep-line{flex:1;height:1px;background:var(--border)}
.lv-sep-label{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}

/* ── CARD ── */
.mcard{background:var(--card);border-radius:var(--r-xl);border:1px solid var(--border);box-shadow:var(--sh);overflow:hidden;animation:cardIn .35s ease both;transition:box-shadow var(--t),transform var(--t)}
.mcard:hover{box-shadow:var(--sh-h);transform:translateY(-1px)}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.mcard-head{padding:18px 20px 0}
.mcard-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.q-num{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.04em}
.lv-badge{font-size:10px;font-weight:700;padding:2px 9px;border-radius:20px;letter-spacing:.03em}
.lb-basic{background:var(--green-l);color:var(--green);border:1px solid #9dd4b6}
.lb-intermediate{background:var(--accent-l);color:var(--accent);border:1px solid #a8c8e8}
.lb-advanced{background:var(--amber-l);color:var(--amber);border:1px solid #f0c870}
.lb-intensive{background:var(--purple-l);color:var(--purple);border:1px solid #c4a8e8}
.topic-tag{margin-left:auto;font-size:10px;color:var(--ink3);background:var(--bg2);border:1px solid var(--border);padding:2px 8px;border-radius:4px}

/* ── LOGIC ARROW ── */
.logic-arrow{display:flex;align-items:stretch;gap:0;margin-bottom:14px;border-radius:var(--r);overflow:hidden;border:1.5px solid var(--border);transition:box-shadow var(--t),transform var(--t);cursor:default}
.logic-arrow:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:scale(1.005)}
.la-box{padding:11px 14px;font-size:13px;font-weight:600;flex:1;text-align:center;display:flex;align-items:center;justify-content:center;line-height:1.4;min-width:0}
.la-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;flex-shrink:0;gap:4px;min-width:88px}
.la-logic-type{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.la-arrows{display:flex;align-items:center}
.la-arr{width:22px;height:2px;position:relative}
.la-arr.r::after{content:'';position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid currentColor;border-right:none}
.la-arr.b::before{content:'';position:absolute;left:-1px;top:-4px;border:5px solid transparent;border-right:7px solid currentColor;border-left:none}
.la-arr.b::after{content:'';position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid currentColor;border-right:none}

/* Logic color themes */
.lt-cause .la-box.a{background:#fff8e6;color:#8a5a00}
.lt-cause .la-box.b{background:#e6f3ec;color:#1c6847}
.lt-cause .la-mid{background:#fef2d4;color:#8a5a00}
.lt-cause .la-arr{background:#8a5a00;color:#8a5a00}
.lt-cause{border-color:#f0c870}

.lt-contrast .la-box.a{background:#e6f3ec;color:#1c6847}
.lt-contrast .la-box.b{background:#fdf0f0;color:#b52c2c}
.lt-contrast .la-mid{background:#faeaea;color:#b52c2c}
.lt-contrast .la-arr{background:#b52c2c;color:#b52c2c}
.lt-contrast{border-color:#f5a8a8}

.lt-choice .la-box.a{background:#e7f1f8;color:#2b5f88}
.lt-choice .la-box.b{background:#e7f1f8;color:#2b5f88}
.lt-choice .la-mid{background:#dbeef8;color:#2b5f88}
.lt-choice .la-arr{background:#2b5f88;color:#2b5f88}
.lt-choice{border-color:#a8c8e8}

.lt-negation .la-box.a{background:#f2eeff;color:#562b8a}
.lt-negation .la-box.b{background:#f2eeff;color:#562b8a}
.lt-negation .la-mid{background:#e8e0ff;color:#562b8a}
.lt-negation .la-arr{background:#562b8a;color:#562b8a}
.lt-negation{border-color:#c4a8e8}

.lt-complex .la-box.a{background:#fff2e6;color:#b84f00}
.lt-complex .la-box.b{background:#e7f6f3;color:#0d6255}
.lt-complex .la-mid{background:#fde8d4;color:#b84f00}
.lt-complex .la-arr{background:#b84f00;color:#b84f00}
.lt-complex{border-color:#f0a870}

/* ── PROMPT ── */
.logic-dot-row{display:flex;align-items:center;gap:7px;margin-bottom:8px}
.logic-dot{width:8px;height:8px;border-radius:50%;background:var(--amber-m);flex-shrink:0}
.logic-dot-label{font-size:11px;font-weight:600;color:var(--amber);letter-spacing:.04em}
.prompt-text{font-size:13px;color:var(--ink2);margin-bottom:14px;line-height:1.65}

/* ── COLLOCATION TABLE ── */
.colloc-wrap{margin:0 0 16px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.colloc-hdr{display:flex;align-items:center;gap:8px;padding:7px 13px;background:var(--bg2);border-bottom:1px solid var(--border)}
.colloc-hdr-icon{width:16px;height:16px;border-radius:50%;background:var(--amber);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;color:#fff;font-weight:700}
.colloc-hdr-title{font-size:11px;font-weight:700;color:var(--amber);letter-spacing:.05em;text-transform:uppercase}
.colloc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));background:var(--card)}
.colloc-item{padding:7px 13px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:2px;transition:background var(--t);cursor:default}
.colloc-item:hover{background:var(--amber-l)}
.colloc-ph{font-size:12px;font-weight:600;color:var(--ink);font-style:italic}
.colloc-vi{font-size:11px;color:var(--ink3);font-weight:300}

/* ── SLOTS ── */
.slots-wrap{padding:0 20px 20px;display:flex;flex-direction:column;gap:10px}
.slot{background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;transition:border-color var(--t),box-shadow var(--t)}
.slot:focus-within{border-color:var(--accent-m);background:var(--accent-xl);box-shadow:0 0 0 3px rgba(56,121,181,.1)}
.slot.s-ok{border-color:#9dd4b6;background:var(--green-l)}
.slot.s-no{border-color:#f5a8a8;background:var(--red-l)}

.slot-hdr{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.slot.s-ok .slot-hdr{border-color:#c4ead4}
.slot.s-no .slot-hdr{border-color:#f5c8c8}
.slot-label{font-size:11px;font-weight:600;color:var(--ink3);letter-spacing:.04em;flex:1;min-width:80px}
.fb-tags{display:flex;gap:4px;flex-wrap:wrap}
.fbt{display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;border:1.5px solid}
.fbt-FOR{background:#fff3e7;color:#7a3200;border-color:#e8b888}
.fbt-AND{background:#e6f3ec;color:#1c6847;border-color:#9dd4b6}
.fbt-NOR{background:#f2eeff;color:#562b8a;border-color:#c4a8e8}
.fbt-BUT{background:#fdf0f0;color:#b52c2c;border-color:#f5a8a8}
.fbt-OR {background:#e7f1f8;color:#2b5f88;border-color:#a8c8e8}
.fbt-YET{background:#faeef9;color:#7b1f72;border-color:#e8a8e0}
.fbt-SO {background:#e7f6f3;color:#0d6255;border-color:#80cbb8}

.slot-ta{width:100%;padding:10px 12px;border:none;background:transparent;font-family:'Lexend',sans-serif;font-size:14px;font-weight:400;color:var(--ink);outline:none;resize:none;min-height:44px;line-height:1.6;-webkit-text-size-adjust:100%}
.slot-ta::placeholder{color:var(--ink3);font-weight:300}
.slot-ta:disabled{cursor:default;color:var(--ink2)}

/* feedback */
.slot-fb{display:none;padding:10px 12px;font-size:12.5px;line-height:1.6;border-top:1px dashed var(--border)}
.slot-fb.show{display:block;animation:fbIn .2s ease}
@keyframes fbIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.slot-fb.ok{background:var(--green-l);color:var(--green);border-color:#c4ead4}
.slot-fb.no{background:var(--red-l);color:var(--red);border-color:#f5c8c8}
.fb-hd{font-weight:700;margin-bottom:3px;font-size:12px}
.fb-why{font-weight:400;margin-bottom:4px}
.fb-model{font-size:11.5px;opacity:.8;font-style:italic;border-top:1px dashed currentColor;padding-top:5px;margin-top:4px}
.fb-model b{font-weight:600;font-style:normal}

/* checking spinner */
.slot-checking{display:none;padding:8px 12px;font-size:12px;color:var(--amber);background:var(--amber-l);border-top:1px solid var(--amber-m);align-items:center;gap:6px}
.slot-checking.show{display:flex}
.spin{width:11px;height:11px;border:1.5px solid var(--amber-m);border-top-color:var(--amber);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── CARD ACTIONS ── */
.card-actions{display:flex;gap:8px;padding:0 20px 18px;flex-wrap:wrap;align-items:center}
.check-btn{padding:9px 22px;border-radius:20px;border:none;background:var(--accent);color:#fff;font-family:'Lexend',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:var(--t)}
.check-btn:hover{background:var(--accent-m);transform:translateY(-1px);box-shadow:0 4px 14px rgba(43,95,136,.25)}
.check-btn:active{transform:scale(.97)}
.check-btn:disabled{background:var(--ink3);cursor:default;transform:none;box-shadow:none}
.redo-btn{padding:9px 16px;border-radius:20px;border:1.5px solid var(--border2);background:transparent;font-family:'Lexend',sans-serif;font-size:12px;font-weight:500;color:var(--ink2);cursor:pointer;transition:var(--t);display:none;align-items:center;gap:5px}
.redo-btn:hover{border-color:var(--accent-m);color:var(--accent);background:var(--accent-xl)}
.redo-btn.show{display:inline-flex}

/* card summary */
.card-summary{display:none;margin:0 20px 14px;padding:12px 14px;border-radius:var(--r-sm);font-size:13px;line-height:1.65}
.card-summary.show{display:block;animation:cardIn .22s ease}
.card-summary.ok{background:var(--green-l);border:1px solid #9dd4b6;color:var(--green)}
.card-summary.partial{background:var(--amber-l);border:1px solid #f0c870;color:var(--amber)}
.card-summary.no{background:var(--red-l);border:1px solid #f5a8a8;color:var(--red)}
.cs-hd{font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.cs-insight{font-size:12px;font-weight:400;margin-top:5px;border-top:1px dashed currentColor;padding-top:6px;line-height:1.6;opacity:.9}
.cs-insight-lbl{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.65;display:block;margin-bottom:2px}

/* model answers toggle */
.model-wrap{display:none;margin:0 20px 16px;border-radius:var(--r-sm);border:1px solid var(--border);overflow:hidden}
.model-wrap.show{display:block}
.model-tog{width:100%;display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--bg2);border:none;font-family:'Lexend',sans-serif;font-size:11.5px;font-weight:600;color:var(--ink2);cursor:pointer;transition:var(--t)}
.model-tog:hover{color:var(--accent);background:var(--accent-xl)}
.model-tog .arr{transition:transform .2s;font-size:10px}
.model-tog.open .arr{transform:rotate(180deg)}
.model-body{display:none;padding:12px 14px;background:var(--card)}
.model-tog.open+.model-body{display:block}
.model-ex{padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;line-height:1.65}
.model-ex:last-child{border-bottom:none;padding-bottom:0}
.mex-style{font-size:10px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:3px}
.mex-conj{font-weight:700;background:var(--accent-l);color:var(--accent);padding:1px 5px;border-radius:3px}

/* ── FINAL SCORE ── */
.final-wrap{max-width:700px;margin:20px auto 0;padding:0 16px;display:none}
.final-wrap.show{display:block;animation:cardIn .4s ease}
.final-inner{background:var(--card);border-radius:var(--r-xl);border:1px solid var(--border);box-shadow:var(--sh);padding:36px 24px;text-align:center}
.final-ring{width:96px;height:96px;border-radius:50%;background:var(--accent-l);border:3px solid var(--accent-m);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px}
.final-num{font-size:30px;font-weight:700;color:var(--accent);line-height:1}
.final-denom{font-size:12px;color:var(--ink3)}
.final-title{font-size:17px;font-weight:600;margin-bottom:6px}
.final-sub{font-size:13px;color:var(--ink2);font-weight:300;margin-bottom:22px;line-height:1.65}
.reset-all-btn{padding:12px 28px;border-radius:24px;border:none;background:var(--accent);color:#fff;font-family:'Lexend',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:var(--t);display:inline-flex;align-items:center;gap:8px}
.reset-all-btn:hover{background:var(--accent-m);transform:translateY(-2px);box-shadow:0 6px 20px rgba(43,95,136,.28)}

/* ── RESPONSIVE ── */
@media(max-width:480px){
  .la-box{font-size:11px;padding:9px 8px}
  .la-mid{min-width:70px;padding:6px 7px}
  .mcard-head{padding:14px 14px 0}
  .slots-wrap,.card-actions{padding-left:14px;padding-right:14px}
  .model-wrap,.card-summary{margin-left:14px;margin-right:14px}
  .colloc-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-logo">Logic Mindset → Câu ghép FANBOYS</div>
    <div class="score-pill" id="topScore">0 / 20</div>
  </div>
</header>

<div class="prog-wrap">
  <div class="prog-meta"><span>Tiến độ</span><b id="progLbl">0 / 20 bài đã nộp</b></div>
  <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
</div>

<div class="filter-wrap">
  <div class="filter-scroll">
    <button class="ftab active" onclick="doFilter('all',this)">Tất cả <span class="ct">(20)</span></button>
    <button class="ftab" onclick="doFilter('basic',this)">Căn bản <span class="ct">(6)</span></button>
    <button class="ftab" onclick="doFilter('intermediate',this)">Trung cấp <span class="ct">(6)</span></button>
    <button class="ftab" onclick="doFilter('advanced',this)">Nâng cao <span class="ct">(5)</span></button>
    <button class="ftab" onclick="doFilter('intensive',this)">Intensive <span class="ct">(3)</span></button>
  </div>
</div>

<div class="main" id="mainWrap"></div>

<div class="final-wrap" id="finalWrap">
  <div class="final-inner">
    <div class="final-ring"><div class="final-num" id="finalNum">0</div><div class="final-denom">/ 20</div></div>
    <div class="final-title" id="finalTitle">Hoàn thành!</div>
    <div class="final-sub" id="finalSub"></div>
    <button class="reset-all-btn" onclick="resetAll()">↺ Làm lại tất cả</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════
   LOGIC TYPE THEMES
══════════════════════════════════════ */
var LT = {
  cause:   {cls:'lt-cause',    lbl:'CAUSE → EFFECT',     arr:'r'},
  contrast:{cls:'lt-contrast', lbl:'CONTRAST ↔',         arr:'b'},
  choice:  {cls:'lt-choice',   lbl:'CHOICE / OR',        arr:'r'},
  negation:{cls:'lt-negation', lbl:'NOR — PHỦ ĐỊNH KÉP', arr:'b'},
  complex: {cls:'lt-complex',  lbl:'MULTI-LOGIC',        arr:'r'}
};
var LV_VI  = {basic:'Căn bản',intermediate:'Trung cấp',advanced:'Nâng cao',intensive:'Intensive'};
var LV_CLS = {basic:'lb-basic',intermediate:'lb-intermediate',advanced:'lb-advanced',intensive:'lb-intensive'};

/* ══════════════════════════════════════
   DATA — 20 MINDSET EXERCISES
══════════════════════════════════════ */
var DATA = [

/* ─── CĂN BẢN 1-6 ─── */
{id:1,lv:'basic',topic:'Daily Life',
 cA:'Cảm thấy mệt',cB:'Cần nghỉ ngơi / Đi ngủ sớm',lt:'cause',
 logicDot:'Nguyên nhân → Hệ quả tự nhiên',
 prompt:'Viết 2 câu: Câu 1 dùng SO (mệt → đi ngủ sớm). Câu 2 dùng FOR (đặt kết quả trước, lý do sau).',
 collocs:[
   {ph:'feel exhausted',vi:'cảm thấy kiệt sức'},
   {ph:'go to bed early',vi:'đi ngủ sớm'},
   {ph:'take a rest',vi:'nghỉ ngơi'},
   {ph:'work long hours',vi:'làm việc nhiều giờ'},
   {ph:'fall asleep quickly',vi:'ngủ thiếp đi nhanh'},
   {ph:'have a good sleep',vi:'ngủ ngon'},
   {ph:'feel refreshed',vi:'cảm thấy sảng khoái'}
 ],
 slots:[
   {lbl:'Style 1 — SO (nguyên nhân → kết quả)',hints:['SO'],ph:'She was very tired, so ...',fb:'SO',
    model:'She was very tired, so she went to bed early.',

    no:'YET: [lợi ích kinh tế], yet [mặt tiêu cực văn hóa]. Ví dụ: "It creates wealth, yet many young people are losing touch with their own traditions."'},
   {lbl:'Style 3 — FOR (giải thích lý do)',hints:['FOR'],ph:'Many traditional customs are disappearing, for ...',fb:'FOR',
    model:'Many traditional customs are disappearing, for global brands and media are encouraging people to adopt similar lifestyles everywhere.',
    ok:'Tuyệt! FOR giải thích nguyên nhân: đặt hiện tượng trước, FOR + lý do tại sao sau.',

 ],
 insight:'AND + YET + FOR tạo bài phân tích đa chiều: liệt kê lợi ích, thừa nhận nghịch lý, giải thích nguyên nhân. Bạn không cần từ ngữ phức tạp — điều quan trọng là logic giữa các mệnh đề phải đúng.'
},

{id:20,lv:'intensive',topic:'Environment & Policy',
 cA:'Không hành động về biến đổi khí hậu',cB:'Thiệt hại không thể phục hồi',lt:'complex',
 logicDot:'Nguy cơ → Cần hành động khẩn cấp',
 prompt:'Viết 3 câu về biến đổi khí hậu. Câu 1: SO (phát thải nhiều → nhiệt độ tăng). Câu 2: YET (bằng chứng rõ nhưng nhiều nước chậm hành động). Câu 3: OR (cảnh báo về hậu quả).',
 collocs:[
   {ph:'carbon emissions increase',vi:'khí thải carbon tăng'},
   {ph:'global temperatures rise',vi:'nhiệt độ toàn cầu tăng'},
   {ph:'take action',vi:'hành động'},
   {ph:'extreme weather events',vi:'các hiện tượng thời tiết cực đoan'},
   {ph:'protect the planet',vi:'bảo vệ hành tinh'},
   {ph:'face serious consequences',vi:'đối mặt với hậu quả nghiêm trọng'},
   {ph:'reduce greenhouse gases',vi:'giảm khí nhà kính'}
 ],
 slots:[
   {lbl:'Style 1 — SO (nhân quả khoa học)',hints:['SO'],ph:'Carbon emissions have been rising for decades, so ...',fb:'SO',
    model:'Carbon emissions have been rising for decades, so global temperatures are now higher than ever before.',
    ok:'Đúng! SO thể hiện quan hệ nhân quả khoa học: phát thải tăng → nhiệt độ tăng.',
    no:'SO: [thực trạng phát thải], so [hậu quả khí hậu]. Ví dụ: "Factories burn more fuel each year, so the air in many cities is getting harder to breathe."'},
   {lbl:'Style 2 — YET (nghịch lý hành động)',hints:['YET'],ph:'The evidence for climate change is clear, yet ...',fb:'YET',
    model:'The evidence for climate change is clear, yet many governments are still slow to take the necessary action.',
    ok:'Hay! YET nhấn mạnh nghịch lý: bằng chứng đầy đủ nhưng chính phủ vẫn chậm hành động.',
    no:'YET: [bằng chứng khoa học rõ ràng], yet [sự chậm trễ đáng lo ngại]. Ví dụ: "Scientists have warned about this for years, yet few major changes have been made."'},
   {lbl:'Style 3 — OR (cảnh báo khẩn cấp)',hints:['OR'],ph:'Countries must reduce their emissions now, or ...',fb:'OR',
    model:'Countries must reduce their emissions now, or the effects of climate change will become impossible to reverse.',
    ok:'Xuất sắc! OR cảnh báo khẩn cấp: phải hành động ngay, hoặc hậu quả sẽ không thể đảo ngược.',
    no:'OR: [hành động khẩn cấp cần làm], or [hậu quả thảm khốc]. Ví dụ: "We need to change our habits now, or future generations will face a very difficult world."'}
 ],
 insight:'SO + YET + OR là bộ ba lý tưởng cho IELTS Task 2 về môi trường: SO nêu hệ quả khoa học, YET chỉ ra nghịch lý chính sách, OR cảnh báo về tương lai. Logic rõ ràng quan trọng hơn từ ngữ phức tạp.'
}

]; /* end DATA */

/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
var state = {};
var curFilter = 'all';

/* ══════════════════════════════════════
   BUILD LOGIC ARROW
══════════════════════════════════════ */
function buildArrow(d) {
  var lt = LT[d.lt] || LT.cause;
  var arrHtml = '<div class="la-arr ' + lt.arr + '" style="background:currentColor"></div>';
  return '<div class="logic-arrow ' + lt.cls + '">'
    + '<div class="la-box a">' + esc(d.cA) + '</div>'
    + '<div class="la-mid"><div class="la-logic-type">' + esc(lt.lbl) + '</div><div class="la-arrows">' + arrHtml + '</div></div>'
    + '<div class="la-box b">' + esc(d.cB) + '</div>'
  + '</div>';
}

/* ══════════════════════════════════════
   BUILD COLLOC TABLE
══════════════════════════════════════ */
function buildColloc(collocs) {
  var items = collocs.map(function(c) {
    return '<div class="colloc-item"><div class="colloc-ph">' + esc(c.ph) + '</div><div class="colloc-vi">' + esc(c.vi) + '</div></div>';
  }).join('');
  return '<div class="colloc-wrap">'
    + '<div class="colloc-hdr"><div class="colloc-hdr-icon">★</div><div class="colloc-hdr-title">Từ vựng &amp; Collocations</div></div>'
    + '<div class="colloc-grid">' + items + '</div>'
  + '</div>';
}

/* ══════════════════════════════════════
   BUILD CARD
══════════════════════════════════════ */
function buildCard(d, delay) {
  var slotsHtml = d.slots.map(function(s, si) {
    var hints = s.hints.map(function(h) {
      return '<span class="fbt fbt-' + h + '">' + h + '</span>';
    }).join('');
    return '<div class="slot" id="slot-' + d.id + '-' + si + '">'
      + '<div class="slot-hdr"><span class="slot-label">' + esc(s.lbl) + '</span><span class="fb-tags">' + hints + '</span></div>'
      + '<textarea class="slot-ta" id="ta-' + d.id + '-' + si + '" rows="2" placeholder="' + esc(s.ph) + '" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>'
      + '<div class="slot-checking" id="ck-' + d.id + '-' + si + '"><div class="spin"></div>Đang kiểm tra...</div>'
      + '<div class="slot-fb" id="fb-' + d.id + '-' + si + '"></div>'
    + '</div>';
  }).join('');

  var el = document.createElement('div');
  el.className = 'mcard';
  el.id = 'mc-' + d.id;
  el.style.animationDelay = delay + 'ms';
  el.innerHTML =
    '<div class="mcard-head">'
      + '<div class="mcard-meta"><span class="q-num">#' + d.id + '</span>'
      + '<span class="lv-badge ' + LV_CLS[d.lv] + '">' + LV_VI[d.lv] + '</span>'
      + '<span class="topic-tag">' + esc(d.topic) + '</span></div>'
      + buildArrow(d)
      + '<div class="logic-dot-row"><div class="logic-dot"></div><div class="logic-dot-label">' + esc(d.logicDot) + '</div></div>'
      + '<div class="prompt-text">' + esc(d.prompt) + '</div>'
    + '</div>'
    + '<div style="padding:0 20px">' + buildColloc(d.collocs) + '</div>'
    + '<div class="slots-wrap">' + slotsHtml + '</div>'
    + '<div class="card-summary" id="cs-' + d.id + '"></div>'
    + '<div class="model-wrap" id="mw-' + d.id + '">'
      + '<button class="model-tog" onclick="togModel(this)">Xem đáp án mẫu (Band 5.5–6.5) <span class="arr">▾</span></button>'
      + '<div class="model-body" id="mb-' + d.id + '"></div>'
    + '</div>'
    + '<div class="card-actions">'
      + '<button class="check-btn" id="cb-' + d.id + '" onclick="checkCard(' + d.id + ')">Kiểm tra</button>'
      + '<button class="redo-btn" id="rb-' + d.id + '" onclick="redoCard(' + d.id + ')">↺ Làm lại</button>'
    + '</div>';
  return el;
}

/* ══════════════════════════════════════
   API CHECKING
══════════════════════════════════════ */
function buildAPIPrompt(d, slot, value) {
  return 'You are an IELTS writing teacher. Evaluate this student sentence:\n\n'
    + 'Context: ' + d.cA + ' → ' + d.cB + '\n'
    + 'Required conjunction: ' + slot.fb + '\n'
    + 'Student wrote: "' + value + '"\n\n'
    + 'Check ONLY these two things:\n'
    + '1. Does the sentence contain "' + slot.fb + '" used as a coordinating conjunction?\n'
    + '2. Does subject-verb agreement look correct?\n\n'
    + 'Respond ONLY with this exact JSON (no markdown, no extra text):\n'
    + '{"ok":true/false,"issue":"one short issue in Vietnamese if not ok, else empty string"}\n\n'
    + 'Be lenient — accept any sentence that has the right conjunction and makes basic sense.';
}

function checkSlotAPI(d, slot, si, value, cb) {
  var ckEl = document.getElementById('ck-' + d.id + '-' + si);
  var slotEl = document.getElementById('slot-' + d.id + '-' + si);
  if (ckEl) ckEl.classList.add('show');

  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 120,
      messages: [{ role: 'user', content: buildAPIPrompt(d, slot, value) }]
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (ckEl) ckEl.classList.remove('show');
    var txt = '';
    if (data.content && data.content[0] && data.content[0].text) {
      txt = data.content[0].text.trim().replace(/^```json\s*/,'').replace(/```$/,'').trim();
    }
    var result;
    try { result = JSON.parse(txt); } catch(e) { result = null; }
    if (!result) {
      var hasConj = new RegExp('\\b' + slot.fb + '\\b', 'i').test(value);
      result = { ok: hasConj && value.trim().length > 10, issue: hasConj ? '' : 'Câu cần có từ nối ' + slot.fb + '.' };
    }
    cb(result);
  })
  .catch(function() {
    if (ckEl) ckEl.classList.remove('show');
    var hasConj = new RegExp('\\b' + slot.fb + '\\b', 'i').test(value);
    cb({ ok: hasConj && value.trim().length > 10, issue: hasConj ? '' : 'Câu cần có từ nối ' + slot.fb + '.' });
  });
}

/* ══════════════════════════════════════
   CHECK CARD
══════════════════════════════════════ */
function checkCard(id) {
  var d = findD(id);
  if (!d || state[id]) return;
  var cbBtn = document.getElementById('cb-' + id);
  if (cbBtn) cbBtn.disabled = true;

  // Validate all filled
  var allOk = true;
  d.slots.forEach(function(s, si) {
    var ta = document.getElementById('ta-' + id + '-' + si);
    if (!ta || ta.value.trim().length < 8) allOk = false;
  });
  if (!allOk) {
    if (cbBtn) cbBtn.disabled = false;
    d.slots.forEach(function(s, si) {
      var ta = document.getElementById('ta-' + id + '-' + si);
      var slotEl = document.getElementById('slot-' + id + '-' + si);
      if (ta && ta.value.trim().length < 8 && slotEl) {
        slotEl.style.outline = '2px solid ' + 'var(--amber-m)';
        setTimeout(function() { slotEl.style.outline = ''; }, 1800);
      }
    });
    return;
  }

  // Disable textareas
  var vals = [];
  d.slots.forEach(function(s, si) {
    var ta = document.getElementById('ta-' + id + '-' + si);
    vals.push(ta ? ta.value.trim() : '');
    if (ta) ta.disabled = true;
  });

  // Check each slot via API
  var results = new Array(d.slots.length);
  var pending = d.slots.length;
  d.slots.forEach(function(s, si) {
    checkSlotAPI(d, s, si, vals[si], function(res) {
      results[si] = res;
      pending--;
      if (pending === 0) finishCard(id, d, results);
    });
  });
}

function finishCard(id, d, results) {
  var correct = 0;
  d.slots.forEach(function(s, si) {
    var res = results[si];
    var slotEl = document.getElementById('slot-' + id + '-' + si);
    var ok = res.ok;
    if (ok) correct++;
    if (slotEl) { slotEl.classList.remove('s-ok','s-no'); slotEl.classList.add(ok ? 's-ok' : 's-no'); }
  });

  // Render feedback per slot
  d.slots.forEach(function(s, si) {
    var res = results[si];
    var fbEl = document.getElementById('fb-' + id + '-' + si);
    var ok = res.ok;
    var why = ok ? s.ok : (res.issue ? res.issue + ' ' + s.no : s.no);
    var model = '<b>Đáp án mẫu:</b> ' + esc(s.model).replace(
      new RegExp('\\b(' + s.hints.join('|') + ')\\b', 'gi'),
      function(m) { return '<span class="mex-conj">' + m + '</span>'; }
    );
    if (fbEl) {
      fbEl.innerHTML = '<div class="fb-hd">' + (ok ? '✓ Chấp nhận!' : '✗ Chưa đúng') + '</div>'
        + '<div class="fb-why">' + why + '</div>'
        + '<div class="fb-model">' + model + '</div>';
      fbEl.className = 'slot-fb show ' + (ok ? 'ok' : 'no');
    }
  });

  // State
  state[id] = { done: true, correct: correct, total: d.slots.length };

  // Summary
  var cs = document.getElementById('cs-' + id);
  var pct = Math.round(correct / d.slots.length * 100);
  var cls = pct === 100 ? 'ok' : pct >= 50 ? 'partial' : 'no';
  var icon = pct === 100 ? '✓' : pct >= 50 ? '~' : '✗';
  if (cs) {
    cs.innerHTML = '<div class="cs-hd"><span>' + icon + '</span> ' + correct + '/' + d.slots.length + ' slot được chấp nhận</div>'
      + '<div class="cs-insight"><span class="cs-insight-lbl">Ghi nhớ sư phạm</span>' + esc(d.insight) + '</div>';
    cs.className = 'card-summary show ' + cls;
  }

  // Model answers
  var mb = document.getElementById('mb-' + id);
  var mw = document.getElementById('mw-' + id);
  if (mb) {
    mb.innerHTML = d.slots.map(function(s) {
      var highlighted = esc(s.model).replace(
        new RegExp('\\b(' + s.hints.join('|') + ')\\b', 'gi'),
        function(m) { return '<span class="mex-conj">' + m + '</span>'; }
      );
      return '<div class="model-ex"><span class="mex-style">' + esc(s.lbl) + '</span><span>' + highlighted + '</span></div>';
    }).join('');
  }
  if (mw) mw.classList.add('show');

  // Redo btn
  var rb = document.getElementById('rb-' + id);
  if (rb) rb.classList.add('show');

  updateProgress();
  if (correct > 0) {
    var sp = document.getElementById('topScore');
    sp.classList.remove('bump'); void sp.offsetWidth; sp.classList.add('bump');
  }
  checkDone();
}

/* ══════════════════════════════════════
   MODEL TOGGLE
══════════════════════════════════════ */
function togModel(btn) { btn.classList.toggle('open'); }

/* ══════════════════════════════════════
   REDO
══════════════════════════════════════ */
function redoCard(id) {
  delete state[id];
  var d = findD(id);
  if (!d) return;
  var old = document.getElementById('mc-' + id);
  if (!old) return;
  old.parentNode.replaceChild(buildCard(d, 0), old);
  updateProgress();
}

/* ══════════════════════════════════════
   FILTER
══════════════════════════════════════ */
function doFilter(lv, btn) {
  curFilter = lv;
  document.querySelectorAll('.ftab').forEach(function(t) { t.classList.remove('active'); });
  btn.classList.add('active');
  render();
}

/* ══════════════════════════════════════
   RENDER
══════════════════════════════════════ */
function render() {
  var wrap = document.getElementById('mainWrap');
  wrap.innerHTML = '';
  ['basic','intermediate','advanced','intensive'].forEach(function(lv) {
    if (curFilter !== 'all' && curFilter !== lv) return;
    var items = DATA.filter(function(d) { return d.lv === lv; });
    var sep = document.createElement('div');
    sep.className = 'lv-sep';
    sep.innerHTML = '<div class="lv-sep-line"></div><div class="lv-sep-label">' + LV_VI[lv] + '</div><div class="lv-sep-line"></div>';
    wrap.appendChild(sep);
    items.forEach(function(d, i) { wrap.appendChild(buildCard(d, i * 45)); });
  });
  updateProgress();
}

/* ══════════════════════════════════════
   PROGRESS + DONE
══════════════════════════════════════ */
function updateProgress() {
  var done = Object.keys(state).length;
  var total = DATA.length;
  var correct = Object.values(state).filter(function(s) { return s.correct === s.total; }).length;
  document.getElementById('progFill').style.width = (done / total * 100) + '%';
  document.getElementById('progLbl').textContent = done + ' / ' + total + ' bài đã nộp';
  document.getElementById('topScore').textContent = correct + ' / ' + total;
}

function checkDone() {
  var vis = curFilter === 'all' ? DATA : DATA.filter(function(d) { return d.lv === curFilter; });
  if (!vis.every(function(d) { return !!state[d.id]; })) return;
  var correct = Object.values(state).filter(function(s) { return s.correct === s.total; }).length;
  var total = DATA.length;
  var pct = Math.round(correct / total * 100);
  document.getElementById('finalNum').textContent = correct;
  document.getElementById('finalTitle').textContent = pct >= 85 ? 'Xuất sắc!' : pct >= 70 ? 'Rất tốt!' : pct >= 50 ? 'Khá ổn!' : 'Tiếp tục luyện tập!';
  document.getElementById('finalSub').textContent = 'Bạn viết đúng hoàn toàn ' + correct + '/' + total + ' bài (' + pct + '%). '
    + (pct >= 65 ? 'Khả năng sử dụng FANBOYS của bạn rất linh hoạt!' : 'Hãy xem lại phần "Ghi nhớ sư phạm" để nắm rõ hơn logic.');
  var fw = document.getElementById('finalWrap');
  fw.classList.add('show');
  fw.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function resetAll() {
  state = {};
  document.getElementById('finalWrap').classList.remove('show');
  render();
}

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
function findD(id) {
  for (var i = 0; i < DATA.length; i++) { if (DATA[i].id === id) return DATA[i]; }
  return null;
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

render();
</script>
